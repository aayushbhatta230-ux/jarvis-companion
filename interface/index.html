<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <meta name="description" content="JARVIS - Personal AI assistant">
  <title>JARVIS — Personal AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="offline" data-theme="dark">

  <div class="grid-lines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="42" height="42">
          <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M24 8 L24 40 M8 24 L40 24 M14 14 L34 34 M34 14 L14 34"
                stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
          <circle cx="24" cy="24" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="24" cy="24" r="1.8" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-copy">
        <strong>JARVIS</strong>
        <small>Personal AI</small>
      </span>
    </div>

    <div class="presence" aria-label="Assistant status">
      <span class="chip backend" id="backendChip"><i></i><em id="backendLabel">Offline</em></span>
      <span class="chip mic" id="micChip"><i></i><em id="micLabel">Mic idle</em></span>
    </div>

    <div class="header-actions">
      <button class="icon-button" id="historyButton" type="button" aria-label="Conversation history">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 6h16M4 12h10M4 18h16"/></svg>
        <span>History</span>
      </button>
      <button class="icon-button" id="settingsButton" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M5.9 5.9l1.4 1.4M16.7 16.7l1.4 1.4M18.1 5.9l-1.4 1.4M7.3 16.7l-1.4 1.4"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </header>
<main class="assistant-stage">
    <section class="core-experience" aria-label="JARVIS intelligence core">
      <div class="core-wrap" id="coreVisual" data-state="idle">
        <canvas id="neuralCanvas" aria-label="Animated JARVIS intelligence core"></canvas>
        <div class="core-orbit orbit-a"></div>
        <div class="core-orbit orbit-b"></div>
        <div class="core-caption">
          <span class="core-state-dot"></span>
          <span id="coreStateLabel">Offline</span>
        </div>

      <!-- Agent activity indicator -->
      <div class="activity-indicator" id="activityIndicator" hidden>
        <span class="activity-spinner"></span>
        <span id="activityText"></span>
      </div>
      </div>

      <div class="identity">
        <p class="eyebrow">Personal AI assistant</p>
        <h1 id="stateText">Initializing…</h1>
        <span id="stateDetail">Establishing a secure local link.</span>
      </div>

      <div class="waveform" id="waveform" aria-label="Voice activity visualization"></div>

      <div class="voice-controls">
        <button class="mic-control" id="micButton" type="button" aria-label="Start listening">
          <span class="mic-ring"></span>
          <span class="mic-icon" aria-hidden="true"></span>
          <span class="mic-label" id="micButtonLabel">Start listening</span>
        </button>
        <button class="stop-control" id="stopButton" type="button" aria-label="Interrupt JARVIS" hidden>
          <span class="stop-square" aria-hidden="true"></span>
          <span>Stop</span>
        </button>
      </div>
    </section>

    <section class="conversation" aria-label="Conversation">
      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <form class="command-bar" id="commandForm">
        <input id="commandInput" autocomplete="off" spellcheck="false"
               placeholder="Talk or type to JARVIS…" aria-label="Message JARVIS">
        <button class="input-mic" type="button" id="inputMicButton" aria-label="Start listening"><span></span></button>
        <button class="send-button" type="submit" aria-label="Send message">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 10 L17 4 L12 10 L17 16 Z"/></svg>
          Send
        </button>
      </form>
    </section>
  </main>
<aside class="drawer history-drawer" id="historyDrawer" aria-hidden="true">
    <div class="drawer-header">
      <span>Conversation history</span>
      <button class="icon-button close-button" id="closeHistory" type="button" aria-label="Close history">&times;</button>
    </div>
    <div class="drawer-body" id="historyMessages"></div>
  </aside>

  <aside class="drawer settings-drawer" id="settingsDrawer" aria-hidden="true">
    <div class="drawer-header">
      <span>Settings</span>
      <button class="icon-button close-button" id="closeSettings" type="button" aria-label="Close settings">&times;</button>
    </div>
    <div class="drawer-body" id="settingsBody">
      <label class="setting-row">
        <span class="setting-copy"><strong>Auto-listen</strong><small>Capture microphone continuously</small></span>
        <input type="checkbox" id="setAutoListen">
      </label>
      <label class="setting-row">
        <span class="setting-copy"><strong>Microphone sensitivity</strong><small>Higher = louder required (less false triggers)</small></span>
        <input type="range" id="setSensitivity" min="0.4" max="2.5" step="0.1">
      </label>
      <label class="setting-row">
        <span class="setting-copy"><strong>Response length</strong><small>How detailed JARVIS answers are</small></span>
        <select id="setVerbosity">
          <option value="concise">Concise</option>
          <option value="normal">Balanced</option>
          <option value="detailed">Detailed</option>
        </select>
      </label>
      <label class="setting-row">
        <span class="setting-copy"><strong>Visual intensity</strong><small>Core animation brightness</small></span>
        <input type="range" id="setIntensity" min="0" max="1" step="0.05">
      </label>
      <label class="setting-row">
        <span class="setting-copy"><strong>Barge-in interrupt</strong><small>Speak over JARVIS to cut it off (can false-trigger on loudspeakers)</small></span>
        <input type="checkbox" id="setBargeIn">
      </label>
    </div>
    <p class="drawer-note">Voice selection uses the system default unless <code>JARVIS_VOICE</code> is set.</p>
  </aside>

  
  <div class="modal-overlay" id="confirmModal" aria-hidden="true" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Action requires confirmation</h2>
      <p id="confirmDesc"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="confirmNo">Decline</button>
        <button type="button" class="btn-primary" id="confirmYes">Proceed</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
